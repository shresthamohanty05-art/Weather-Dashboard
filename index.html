<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="weather">
        <h1>Weather Dashboard</h1>
        <div class="search-box">
            <input type="text" placeholder="Enter city name" id="city">

            <button id="search-btn">Search</button>
        </div>

        <div class="weather-card">

            <h3 class="city-name">Cuttack</h3>

            <img class="weather-icon" src="" alt="Weather icon">

            <div class="main-weather">
                <div class="detail-box">
                    <span class="detail-label">🌡️ Temperature</span>
                    <span class="temp"> 28°C </span>
                </div>

                <div class="detail-box">
                    <span class="detail-label">☁️ Condition</span>
                    <span class="condition"> Drizzle </span>
                </div>


            </div>



            <div class="weather-details"></div>

            <div class="detail-box">
                <span class="detail-label">💧 Humidity</span>
                <span class="humidity"> 87% </span>
            </div>
            <div class="detail-box">
                <span class="detail-label">💨 Wind</span>
                <span class="wind"> 4km/h </span>
            </div>

        </div>

        <p class="loading"></p>

        </div>

    </section>



    <script src="config.js"></script>
    <script src="script.js"> </script>

</body>

</html>
